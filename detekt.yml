# Run by scripts/detekt.sh without --build-upon-default-config: a rule that is
# not named here is off. The scope is complexity and unused code, the Kotlin
# side of what fallow gates in TiedSiren.
#
# detekt runs here without type resolution, so it reads one file at a time: it
# finds an unused import, parameter or private member, never an unused public
# or internal declaration.

complexity:
  active: true
  # The thresholds are fallow's defaults (maxCyclomatic, maxCognitive,
  # maxUnitSize), so one function is judged the same in both repositories.
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  CognitiveComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60

style:
  active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true
  UnreachableCatchBlock:
    active: true
