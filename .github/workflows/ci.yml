name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  typescript:
    name: TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build module
        run: npm run build

      - name: Run tests
        run: npm test

  android:
    name: Android Build
    runs-on: ubuntu-latest
    env:
      APK_ARTIFACT_NAME: expo-accessibility-service-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: ./example
        run: npm ci

      - name: Generate Android project (expo prebuild)
        working-directory: ./example
        run: npx expo prebuild --platform android --no-install

      - name: Run Kotlin unit tests
        working-directory: ./example/android
        run: ./gradlew :amehmeto-expo-accessibility-service:testDebugUnitTest

      - name: Build example Android app (release)
        working-directory: ./example/android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv example/android/app/build/outputs/apk/release/app-release.apk \
             example/android/app/build/outputs/apk/release/expo-accessibility-service.apk

      - name: Delete superseded APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?name=${APK_ARTIFACT_NAME}&per_page=100" \
            --jq '.artifacts[].id' \
            | while read -r artifact_id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
              done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: example/android/app/build/outputs/apk/release/expo-accessibility-service.apk
          retention-days: 3
          overwrite: true

      - name: Create PR release
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          name: "Accessibility Service Example APK - PR #${{ github.event.pull_request.number }} (build ${{ github.run_number }})"
          body: |
            Automated build of the **Accessibility Service** example app for PR #${{ github.event.pull_request.number }}.

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.head_ref }}

            Download the APK below to test the changes.
          files: example/android/app/build/outputs/apk/release/expo-accessibility-service.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
